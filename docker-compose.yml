services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-America/Sao_Paulo}
      PGTZ: ${TZ:-America/Sao_Paulo}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    # Backup push: equipamentos enviam o backup pra cá.
    # - 21/tcp: FTP controle (passive na faixa 30000-30099 abaixo)
    # - 22/tcp + 2222/tcp: SFTP. SSH do host foi movido para 2288 para liberar a 22
    #   (default da maioria das OLTs Huawei VRP, que não aceita porta custom). 2222
    #   continua mapeada por compat com OLTs já configuradas apontando para ela.
    # - 69/udp: TFTP (resposta vem da mesma faixa 30000-30099 — UDP só pra
    #   sessões TFTP, mas funciona porque conntrack do iptables bate)
    # - 30000-30099/tcp+udp: faixa passiva (FTP) + portas efêmeras (TFTP)
    ports:
      - "21:21"
      - "22:2222"
      - "2222:2222"
      - "69:69/udp"
      - "30000-30099:30000-30099"
      - "30000-30099:30000-30099/udp"
    volumes:
      # Logs de auth FTP/SFTP em arquivo para o fail2ban (no host) tailar.
      - ./infra/ftp-logs:/var/log/nexus
      # State persistente: host key SFTP (RSA-2048 gerada no primeiro start).
      # Se perder, equipamentos vão acusar fingerprint diferente no próximo
      # connect — daria pra forçar re-aceitação mas é melhor evitar.
      - ./infra/state:/var/lib/nexus
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_VARS: "DOMAIN"
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    depends_on:
      - backend
    # Recarrega o nginx a cada 6h para captar renovações do certbot.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    # Tenta renovar a cada 12h (só efetua troca se estiver a <30 dias do vencimento).
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:

# IPv6 habilitado: necessário para o backend conseguir abrir conexão SSH em
# dispositivos com endereço IPv6 (ex.: links BGP ISP). Requer também
# /etc/docker/daemon.json com "ipv6": true e "ip6tables": true.
networks:
  default:
    driver: bridge
    enable_ipv6: true
